<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Feliz cumpleaños</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Jost:wght@300;400;500&display=swap');

  :root {
    --cream: #F7F4EE;
    --ink: #2E2A24;
    --ink-soft: #6B6459;
    --line: #D8D2C4;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    min-height: 100%;
    background: var(--cream);
    font-family: 'Jost', sans-serif;
    color: var(--ink);
  }

  body {
    display: flex;
    justify-content: center;
    padding: 48px 20px 60px;
  }

  .page {
    width: 100%;
    max-width: 460px;
  }

  .back-link {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: var(--ink-soft);
    text-decoration: none;
    letter-spacing: 0.04em;
    margin-bottom: 36px;
  }

  .tag {
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--ink-soft);
    margin-bottom: 10px;
  }

  .rule {
    width: 36px;
    height: 1px;
    background: var(--line);
    margin-bottom: 28px;
  }

  .body p {
    font-family: 'Cormorant Garamond', serif;
    font-size: 20px;
    line-height: 1.9;
    margin-bottom: 22px;
  }

  .signature {
    margin-top: 40px;
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 20px;
    color: var(--ink-soft);
  }
</style>
</head>
<body>

  <div class="page">
    <a class="back-link" href="index.html">&larr; volver al menú</a>

    <p class="tag">Feliz cumpleaños</p>
    <div class="rule"></div>

    <div class="body">
      <p>Feliz cumpleaños, Fany.</p>
      <p>Espero que tengas un día bonito y que lo disfrutes mucho con tus papás.</p>
      <p>Que este año te traiga todo lo que buscas.</p>
      <p>Feliz cumpleaños.</p>
    </div>
  </div>

</body>
</html>
