<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Para Pekas</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Jost:wght@300;400;500&display=swap');

  :root {
    --cream: #F7F4EE;
    --ink: #2E2A24;
    --ink-soft: #6B6459;
    --line: #D8D2C4;
    --accent: #8FA598;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    background: var(--cream);
    font-family: 'Jost', sans-serif;
    color: var(--ink);
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 20px;
  }

  .card {
    width: 100%;
    max-width: 420px;
    text-align: center;
  }

  .locked {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 28px;
    animation: fade-in 1s ease;
  }

  .ornament {
    width: 34px;
    height: 34px;
    opacity: 0.55;
  }

  h1 {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 500;
    font-size: 40px;
    line-height: 1.25;
    letter-spacing: 0.02em;
  }

  .sub {
    font-size: 14px;
    color: var(--ink-soft);
    letter-spacing: 0.04em;
    max-width: 280px;
    line-height: 1.7;
  }

  .rule {
    width: 48px;
    height: 1px;
    background: var(--line);
  }

  /* Unlocked menu */
  .menu {
    display: none;
    flex-direction: column;
    gap: 20px;
    animation: fade-in 0.8s ease;
  }

  .menu.show { display: flex; }
  .locked.hide { display: none; }

  .menu-header {
    margin-bottom: 8px;
  }

  .menu-header h2 {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 500;
    font-style: italic;
    font-size: 26px;
  }

  .menu-header p {
    font-size: 13px;
    color: var(--ink-soft);
    margin-top: 6px;
  }

  .option {
    display: block;
    text-decoration: none;
    color: var(--ink);
    background: transparent;
    border: none;
    border-bottom: 1px solid var(--line);
    padding: 22px 4px;
    text-align: left;
    transition: padding-left 0.3s ease;
  }

  .option:last-child {
    border-bottom: none;
  }

  .option:hover {
    padding-left: 10px;
  }

  .option-label {
    font-size: 11px;
    letter-spacing: 0.12em;
    color: var(--ink-soft);
    text-transform: uppercase;
    display: block;
    margin-bottom: 6px;
  }

  .option-title {
    font-family: 'Cormorant Garamond', serif;
    font-size: 24px;
    font-style: italic;
  }

  @keyframes fade-in {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  footer {
    margin-top: 40px;
    font-size: 11px;
    color: var(--ink-soft);
    letter-spacing: 0.05em;
  }
</style>
</head>
<body>

  <div class="card">

    <div class="locked" id="locked">
      <svg class="ornament" viewBox="0 0 24 24" fill="none" stroke="var(--ink-soft)" stroke-width="0.8">
        <path d="M12 2 C12 8, 18 8, 18 14 C18 8, 12 8, 12 2 Z" />
        <path d="M12 2 C12 8, 6 8, 6 14 C6 8, 12 8, 12 2 Z" />
        <line x1="12" y1="14" x2="12" y2="22" />
      </svg>
      <h1>Feliz cumpleaños,<br>Pekas</h1>
      <div class="rule"></div>
      <p class="sub">Espero que este día esté lleno de todo lo que te hace bien.</p>
    </div>

    <div class="menu" id="menu">
      <div class="menu-header">
        <h2>Para ti, hoy</h2>
        <p>Tres cosas que quería dejarte</p>
      </div>

      <a class="option" href="carta.html">
        <span class="option-label">Uno</span>
        <span class="option-title">Feliz cumpleaños</span>
      </a>

      <a class="option" href="cosas-que-nunca-te-dije.html">
        <span class="option-label">Dos</span>
        <span class="option-title">Cosas que nunca te dije</span>
      </a>
    </div>

    <footer>Hecho con cariño</footer>
  </div>

  <script>
    // La fecha de desbloqueo: 28 de septiembre, hora local del dispositivo
    var unlockDate = new Date(new Date().getFullYear(), 8, 28, 0, 0, 0); // mes 8 = septiembre (0-indexado)

    var now = new Date();
    if (now >= unlockDate) {
      document.getElementById('locked').classList.add('hide');
      document.getElementById('menu').classList.add('show');
    }
  </script>

</body>
</html>
